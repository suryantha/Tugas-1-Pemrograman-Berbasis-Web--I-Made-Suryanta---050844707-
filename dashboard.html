<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="navbar">
        <a href="stok.html">Informasi Bahan Ajar</a>
        <a href="tracking.html">Tracking Pengiriman</a>
        <div class="dropdown">
            <button class="dropbtn">Laporan
                <i class="fa fa-caret-down"></i>
            </button>
            <div class="dropdown-content">
                <a href="#">Monitoring Progress DO Bahan Ajar</a>
                <a href="#">Rekap Bahan Ajar</a>
            </div>
        </div>
        <a href="#histori transaksi">Histori Transaksi Bahan Ajar</a>
        <button type="button" class="logoutbtn" onclick="logout();">Logout</button>
    </div>
    <h3>Dashboard Aplikasi SITTA</h3>
    <p id="greeting"> Selamat Pagi</p>
    <script>
        const d = new Date();
        let jam = d.getHours();
        let salam = " ";
        if (jam < 10) {
            salam = "Selamat Pagi";
        } else if (jam < 15) {
            salam = "Selamat Siang";
        } else if (jam < 18) {
            salam = "Selamat Sore";
        } else {
            salam = "Selamat Malam";
        }
        document.getElementById("greeting").innerText = salam +", "+ localStorage.getItem("loginUser") + "!";
    </script>
    <script src="js/script.js"></script>
    <script>
        window.onload = function () {
            if (!localStorage.getItem("loginUser")) {
                window.location.href = "index.html";
            }
        }
    </script>
</body>

</html>
